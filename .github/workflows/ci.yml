# SPDX-License-Identifier: Apache-2.0
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Pinned lint, unit, and synthesis smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out immutable source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install pinned upstream Nix
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --proto '=https' --tlsv1.2 \
            --output /tmp/nix-install https://nixos.org/nix/install
          printf '%s  %s\n' \
            '9adda97297d9e8ab360df95c729eabff4f4f93d6db091953c3a68f29e3fb130c' \
            '/tmp/nix-install' | sha256sum --check --strict
          sh /tmp/nix-install --daemon --yes

      - name: Validate locked environment and smoke test
        shell: bash
        run: |
          set -euo pipefail
          source /nix/var/nix/profiles/default/etc/profile.d/nix-daemon.sh
          nix --extra-experimental-features 'nix-command flakes' \
            flake check --accept-flake-config --print-build-logs
